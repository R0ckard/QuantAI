# The Admin Load Check · Cloudflare Worker
# Secrets are NOT here. Set them with `npx wrangler secret put <NAME>`:
#   ANTHROPIC_API_KEY   the two adaptive follow up questions
#   RESEND_API_KEY      confirmation email to them, alert email to Dave
#   TURNSTILE_SECRET    spam check on submit (site key goes in check/config.js)
#   PULL_TOKEN          long random string the local CLI sends as a bearer token
#   ENGINE_TOKEN        the GTM engine's CHECK_INTAKE_TOKEN, to file each submission on the pipeline board
name = "quantai-check"
main = "src/index.js"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[vars]
# Browsers on these origins may call the worker. Comma separated.
ALLOWED_ORIGINS = "https://quantai.com.au,https://www.quantai.com.au,http://127.0.0.1:8766,http://localhost:8766"
# Resend only sends from a verified domain. send.quantai.com.au is verified; quantai.com.au itself is not (yet).
RESEND_FROM = "Dave Richardson, QuantAI <dave@send.quantai.com.au>"
REPLY_TO = "dave@quantai.com.au"
ALERT_TO = "dave@quantai.com.au"
# Where each submission is also passed on, to become a deal on the pipeline board.
# Without this or the ENGINE_TOKEN secret the worker carries on exactly as before.
ENGINE_URL = "https://gtm-engine-dave-s-projects16.vercel.app/api/intake/check"

[[kv_namespaces]]
binding = "SUBMISSIONS"
# Create it once with: npx wrangler kv namespace create SUBMISSIONS
# then paste the id it prints here.
id = "e54afe351e3f4471acc3f3f75f8c9a6e"
